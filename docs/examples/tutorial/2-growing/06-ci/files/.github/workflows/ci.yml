name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get install -y gfortran
          pip install FoBiS.py gcovr
      - name: Dependencies, at the tags the fobos pins
        run: fobis fetch
      - name: Build
        run: fobis build --mode release
      - name: Tests
        run: fobis test --json > tests.json
      - name: Coverage
        run: |
          fobis test --mode coverage
          fobis coverage --mode coverage --format xml --fail-under 90
