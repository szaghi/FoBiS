# Dependabot configuration for FoBiS.py.
# Covers Python (pip) and the GitHub Actions workflows. Updates are grouped so
# related bumps arrive in a single PR instead of one PR per dependency.
# The VitePress docs (npm, /docs) are deliberately absent: their lockfile is
# refreshed by .github/workflows/docs-deps.yml, which commits to master only
# after the docs build passes.
version: 2
updates:
  # Python package (pyproject.toml)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      python-deps:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - "*"
