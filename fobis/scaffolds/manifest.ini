# FoBiS scaffold manifest
# Each section is a destination path relative to the project root.
# source   = path inside fobis/scaffolds/ (verbatim/ or templated/)
# category = verbatim | templated | init-only | patched | symlink | retired
#   verbatim  : copied as-is; status reports MISSING/OUTDATED; sync overwrites
#   templated : {{VAR}} substitution; status reports MISSING/OUTDATED; sync overwrites
#   init-only : created by init if missing; sync never touches; status reports
#               MISSING (absent) or OK (present), never OUTDATED; UNRENDERED if
#               {{VAR}} placeholders are left unfilled
#   retired   : no longer used (no source); status reports RETIRED when present;
#               sync deletes it (with consent) and the directories it empties
# A templated/ source is rendered whatever the category (init-only, patched).
# executable = true | false (default: false)
# when = KEY [KEY2=VALUE ...]: managed only when the fobos [scaffold] KEY is set (and
#   KEY2 equals VALUE); a hand-written file there while it is not is UNMANAGED (drift,
#   never written); a missing conditional init-only file is created by sync too
# retired: kept (reported) while a workflow or action of the project still uses it

[.github/workflows/ci.yml]
source = templated/.github/workflows/ci.yml
category = templated

[.github/workflows/docs.yml]
source = templated/.github/workflows/docs.yml
category = templated

[.github/workflows/install.yml]
source = templated/.github/workflows/install.yml
category = templated

# Composite actions of the workflows before they called the fortran-toolchains reusable workflows (#211): the
# toolchain image and the reusable test workflow replace them.
[.github/actions/setup-build-env/action.yml]
category = retired

[.github/actions/run-coverage-analysis/action.yml]
category = retired

# Optional workflows (#211): managed only while their fobos [scaffold] key is set; a hand-written one with the key
# unset is UNMANAGED.
[.github/workflows/docs-examples.yml]
source = templated/.github/workflows/docs-examples.yml
category = templated
when = docs_examples

[.github/workflows/doctests-sync.yml]
source = templated/.github/workflows/doctests-sync.yml
category = templated
when = doctests_sync

[.github/workflows/fpm.yml]
source = templated/.github/workflows/fpm.yml
category = templated
when = fpm

[.github/workflows/matrix.yml]
source = templated/.github/workflows/matrix.yml
category = templated
when = matrix

# the matrix workflow's default script, while the workflow runs it: created once (init, or sync when missing), then
# the project's
[scripts/ci/matrix.sh]
source = verbatim/scripts/ci/matrix.sh
category = init-only
when = matrix matrix_script=scripts/ci/matrix.sh
executable = true

[scripts/release.sh]
source = verbatim/scripts/release.sh
category = verbatim
executable = true

[scripts/run_tests.sh]
source = verbatim/scripts/run_tests.sh
category = verbatim
executable = true

[scripts/install.sh]
source = verbatim/scripts/install.sh
category = verbatim
executable = true

[scripts/compute-coverage.sh]
source = verbatim/scripts/compute-coverage.sh
category = verbatim
executable = true

[docs/package.json]
source = verbatim/docs/package.json
category = verbatim

[cliff.toml]
source = verbatim/cliff.toml
category = verbatim

# Created once by `scaffold init`, then owned by the project (projects extend
# their contributing guide with repo-specific sections). Never re-synced.
[docs/guide/contributing.md]
source = verbatim/docs/guide/contributing.md
category = init-only

# Repo-root CONTRIBUTING.md is a symlink to the canonical docs page above, so
# GitHub and the VitePress docs site share a single source of truth.
[CONTRIBUTING.md]
category = symlink
target = docs/guide/contributing.md

[LICENSE.gpl3.md]
source = verbatim/LICENSE.gpl3.md
category = verbatim

[.github/workflows/release.yml]
source = templated/.github/workflows/release.yml
category = templated

[docs/.vitepress/config.mts]
source = templated/docs/.vitepress/config.mts
category = patched
patch = vite-es2022-target

; Additive config fragments for `patched` files. Each guarantees a snippet is
; present without overwriting the project-owned file. Fragment lines are guarded
; with a leading `|` at column 0 so configparser preserves their indentation.
; The guarded indentation is *relative to the anchor line*: at apply time each
; line is prefixed with the anchor's own indentation, so `  build: {` nests one
; level (2 spaces) inside the anchored `vite: {` block.
[patch:vite-es2022-target]
probe = target: 'es2022'
anchor = vite: {
guard = build: {
insert =
  |  build: {
  |    target: 'es2022',
  |  },

[docs/ford.md]
source = templated/docs/ford.md
category = init-only

[fpm.toml]
source = templated/fpm.toml
category = init-only

[fobos]
source = templated/fobos
category = init-only
